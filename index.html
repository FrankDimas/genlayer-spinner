<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenLayer Spinner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .dark {
      background: #070707;
      color: #fff;
      width: 100%;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .light {
      background: #F5F5F5;
      color: #070707;
      width: 100%;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    p {
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="dark">
    <h1>GenLayer Spinner — Dark</h1>
    <img src="spinner.svg" width="64" height="64" alt="GenLayer loading spinner">
    <p>Loading state example</p>
  </div>

  <div class="light">
    <h1>GenLayer Spinner — Light</h1>
    <img src="spinner.svg" width="64" height="64" alt="GenLayer loading spinner">
    <p>Loading state example</p>
  </div>

</body>
</html>
