<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenLayer Spinner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 60px 20px;
    }
    .dark { background: #070707; color: #fff; }
    .light { background: #F5F5F5; color: #070707; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="section dark">
    <h1>GenLayer Spinner — Dark</h1>

    <!-- Спиннер вставлен напрямую -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="64" height="64" role="img" aria-label="GenLayer loading">
      <style>
        .v3-ring {
          fill: none; stroke: #110FFF; stroke-width: 3; stroke-linecap: round;
          stroke-dasharray: 18 90; transform-origin: 24px 24px;
          animation: v3-spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
        }
        .v3-core { fill: #110FFF; transform-origin: 24px 24px; animation: v3-pulse 1.2s ease-in-out infinite; }
        @keyframes v3-spin { to { transform: rotate(360deg); } }
        @keyframes v3-pulse { 0%,100% { transform: scale(0.9); opacity:0.8; } 50% { transform: scale(1.1); opacity:1; } }
      </style>
      <circle class="v3-ring" cx="24" cy="24" r="18"/>
      <polygon class="v3-core" points="24,17 31,31 24,27 17,31"/>
    </svg>

    <p>Loading state example</p>
  </div>

  <div class="section light">
    <h1>GenLayer Spinner — Light</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="64" height="64" role="img" aria-label="GenLayer loading">
      <style>
        .v3-ring {
          fill: none; stroke: #110FFF; stroke-width: 3; stroke-linecap: round;
          stroke-dasharray: 18 90; transform-origin: 24px 24px;
          animation: v3-spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
        }
        .v3-core { fill: #110FFF; transform-origin: 24px 24px; animation: v3-pulse 1.2s ease-in-out infinite; }
        @keyframes v3-spin { to { transform: rotate(360deg); } }
        @keyframes v3-pulse { 0%,100% { transform: scale(0.9); opacity:0.8; } 50% { transform: scale(1.1); opacity:1; } }
      </style>
      <circle class="v3-ring" cx="24" cy="24" r="18"/>
      <polygon class="v3-core" points="24,17 31,31 24,27 17,31"/>
    </svg>

    <p>Loading state example</p>
  </div>

</body>
</html>
