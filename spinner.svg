<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="GenLayer loading">
  <style>
    .outer {
      fill: #110FFF;
      transform-origin: 24px 24px;
      animation: spin 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .inner {
      fill: #110FFF;
      transform-origin: 24px 24px;
      animation: spin 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite reverse;
      opacity: 0.55;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(0.82); }
      100% { transform: rotate(360deg) scale(1); }
    }
  </style>

  <!-- Внешний треугольник -->
  <polygon class="outer" points="24,6 40,40 24,32 8,40"/>

  <!-- Внутренний треугольник -->
  <polygon class="inner" points="24,16 32,34 24,29 16,34"/>
</svg>
